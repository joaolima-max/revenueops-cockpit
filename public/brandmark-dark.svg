  <path d="M8 15.6 16 8.4" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="8" cy="15.6" r="2.15" fill="#ffffff"/>
  <circle cx="16" cy="8.4" r="2.15" fill="#6b8cff"/>
</svg>
