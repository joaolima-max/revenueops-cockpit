<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Bass Pago">
  <!-- Marca oficial Bass Pago — versao para FUNDO ESCURO.
       Mesma geometria da versao clara; o no de accent usa o tom "accent soft"
       (#6b8cff), como manda a regra `.dark .bmark .bm-a` do site institucional. -->
